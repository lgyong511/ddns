{{define "login.html"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DDNS 控制台 - 登录</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
</head>
<body class="auth-page">
  <main class="auth-card">
    <img class="brand-logo" src="/static/logo.svg" alt="DDNS">
    <h1>DDNS 控制台</h1>
    <p class="muted">登录后管理解析服务商、记录和 Webhook。</p>
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <label>账号<input name="username" maxlength="64" autocomplete="username" required autofocus></label>
      <label>密码<input name="password" type="password" maxlength="72" autocomplete="current-password" required></label>
      <button class="primary" type="submit">登录</button>
    </form>
  </main>
</body>
</html>
{{end}}

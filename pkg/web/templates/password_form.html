{{define "password_form.html"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 - DDNS 控制台</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/static/logo.svg" alt="">DDNS 控制台</a><nav><a href="/">返回</a><a href="/import">导入配置</a><a href="/export" title="可选择是否包含 Web 账号和密码哈希">导出配置</a><span class="version">版本 {{.Version}}</span></nav></header>
  <main class="shell narrow">
    <h1>修改密码</h1>
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form class="panel form-grid" method="post" action="/password">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>旧密码<input name="oldPassword" type="password" autocomplete="current-password" required autofocus></label>
      <label>新密码<input name="newPassword" type="password" maxlength="72" autocomplete="new-password" required></label>
      <label>确认新密码<input name="confirm" type="password" maxlength="72" autocomplete="new-password" required></label>
      <div class="form-actions">
        <a class="button" href="/">取消</a>
        <button class="primary" type="submit">保存密码</button>
      </div>
    </form>
  </main>
</body>
</html>
{{end}}

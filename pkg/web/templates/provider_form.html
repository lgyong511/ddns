{{define "provider_form.html"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - DDNS 控制台</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/static/logo.svg" alt="">DDNS 控制台</a><nav><a href="/">返回</a><span class="version">版本 {{.Version}}</span></nav></header>
  <main class="shell">
    <h1>{{.Title}}</h1>
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form class="panel form-grid" method="post" action="{{.Action}}">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <div class="form-row two">
        <label>名称<input name="name" value="{{.Form.Name}}" required placeholder="如 aliyun-home"></label>
        <label>强制刷新间隔 (分钟)<input name="forceInterval" type="number" min="5" max="30" value="{{.Form.ForceInterval}}" placeholder="自动"></label>
      </div>
      <fieldset class="provider-radio-grid">
        <legend>服务商</legend>
        <label><input type="radio" name="provider" value="aliyun" {{if eq .Form.Provider "aliyun"}}checked{{end}} required>阿里云</label>
        <label><input type="radio" name="provider" value="tencent" {{if eq .Form.Provider "tencent"}}checked{{end}}>腾讯云</label>
        <label><input type="radio" name="provider" value="baidu" {{if eq .Form.Provider "baidu"}}checked{{end}}>百度云</label>
        <label><input type="radio" name="provider" value="dnsla" {{if eq .Form.Provider "dnsla"}}checked{{end}}>DNSLA</label>
        <label><input type="radio" name="provider" value="huawei" {{if eq .Form.Provider "huawei"}}checked{{end}}>华为云</label>
        <label><input type="radio" name="provider" value="volcengine" {{if eq .Form.Provider "volcengine"}}checked{{end}}>火山引擎</label>
      </fieldset>
      <div class="form-row two">
        <label>Access Key ID<input name="keyId" value="{{.Form.KeyID}}" required></label>
        <label>Access Key Secret<input name="keySecret" type="password" {{if not .IsEdit}}required{{end}} placeholder="{{if .IsEdit}}留空保持不变{{end}}"></label>
      </div>
      <div class="inline-section-title"><h2>解析记录</h2><button class="button small" type="button" id="add-record">＋ 添加记录</button></div>
      <div id="records-list">
        {{range $i, $record := .Form.Records}}
        <div class="provider-record" data-record-index="{{$i}}">
          <div class="provider-record-title"><strong>记录 {{inc $i}}</strong><button class="link danger remove-record" type="button">删除</button></div>
          <div class="form-row two"><label>记录名称<input name="recordName" value="{{$record.Name}}" required placeholder="如 nas_ipv6"></label><label>子域名<input name="recordSubDomains" value="{{$record.SubDomains}}" required placeholder="nas.example.com"></label></div>
          <div class="form-row three"><label>检测间隔 (秒)<input name="recordInterval" type="number" min="10" max="60" value="{{$record.Interval}}" placeholder="自动"></label><label>TTL (秒)<input name="recordTTL" type="number" min="1" max="86400" value="{{$record.TTL}}" placeholder="自动"></label><label>IP 版本<select name="recordIPVersion"><option value="4" {{if eq $record.IPVersion "4"}}selected{{end}}>IPv4</option><option value="6" {{if eq $record.IPVersion "6"}}selected{{end}}>IPv6</option></select></label></div>
          <fieldset class="radio-grid provider-record-methods" data-record-methods aria-label="获取方式">
            <legend>获取方式</legend>
            <label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType{{$i}}" value="cmd" {{if eq $record.GetType "cmd"}}checked{{end}}>系统命令</span></label>
            <label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType{{$i}}" value="nic" {{if eq $record.GetType "nic"}}checked{{end}}>系统网卡</span></label>
            <label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType{{$i}}" value="url" {{if or (eq $record.GetType "") (eq $record.GetType "url")}}checked{{end}}>URL请求</span></label>
            <label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType{{$i}}" value="duid" {{if eq $record.GetType "duid"}}checked{{end}}>DUID标识</span></label>
          </fieldset>
          <div class="method-help-panel"><span class="hint-icon">?</span><span data-record-help></span></div>
          <div class="method-box" data-record-method="nic"><label>本机网卡<select name="recordGetValue"><option value="">请选择本机网卡</option>{{range $.NICs}}<option value="{{.Name}}" {{if eq $record.GetValue .Name}}selected{{end}}>{{.Name}} ({{join .IPs ", "}})</option>{{end}}</select></label></div>
          <div class="method-box" data-record-method="url"><label>URL 请求地址<textarea name="recordGetValue" rows="3" placeholder="留空时按 IP 版本使用预设值">{{if eq $record.GetType "url"}}{{$record.GetValue}}{{end}}</textarea></label></div>
          <div class="method-box" data-record-method="cmd"><label>系统命令<input name="recordGetValue" value="{{if eq $record.GetType "cmd"}}{{$record.GetValue}}{{end}}" placeholder="ip addr show br-lan"></label></div>
          <div class="method-box" data-record-method="duid"><label>DUID<input name="recordGetValue" value="{{if eq $record.GetType "duid"}}{{$record.GetValue}}{{end}}" placeholder="000300019009d009781d"></label></div>
          <label>筛选规则<input name="recordRule" value="{{$record.Rule}}" placeholder="空值表示选择第一个公网 IP"><span class="field-help"><span class="hint-icon">?</span>规则说明：空值选择第一个公网 IP；index@n 选择第 n 个；splice@n@后缀 使用第 n 个 IPv6 前缀拼接后缀；contain@substr 选择包含指定文本的第一个 IP。</span></label>
        </div>
        {{end}}
      </div>
      <template id="record-template"><div class="provider-record" data-record-index="__INDEX__"><div class="provider-record-title"><strong>记录 __NUMBER__</strong><button class="link danger remove-record" type="button">删除</button></div><div class="form-row two"><label>记录名称<input name="recordName" required placeholder="如 nas_ipv6"></label><label>子域名<input name="recordSubDomains" required placeholder="nas.example.com"></label></div><div class="form-row three"><label>检测间隔 (秒)<input name="recordInterval" type="number" min="10" max="60" placeholder="自动"></label><label>TTL (秒)<input name="recordTTL" type="number" min="1" max="86400" placeholder="自动"></label><label>IP 版本<select name="recordIPVersion"><option value="4" selected>IPv4</option><option value="6">IPv6</option></select></label></div><fieldset class="radio-grid provider-record-methods" data-record-methods aria-label="获取方式"><legend>获取方式</legend><label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType__INDEX__" value="cmd">系统命令</span></label><label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType__INDEX__" value="nic">系统网卡</span></label><label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType__INDEX__" value="url" checked>URL请求</span></label><label class="method-option"><span class="method-option-title"><input type="radio" name="recordGetType__INDEX__" value="duid">DUID标识</span></label></fieldset><div class="method-help-panel"><span class="hint-icon">?</span><span data-record-help></span></div><div class="method-box" data-record-method="nic"><label>本机网卡<select name="recordGetValue"><option value="">请选择本机网卡</option>{{range $.NICs}}<option value="{{.Name}}">{{.Name}} ({{join .IPs ", "}})</option>{{end}}</select></label></div><div class="method-box" data-record-method="url"><label>URL 请求地址<textarea name="recordGetValue" rows="3" placeholder="留空时按 IP 版本使用预设值"></textarea></label></div><div class="method-box" data-record-method="cmd"><label>系统命令<input name="recordGetValue" placeholder="ip addr show br-lan"></label></div><div class="method-box" data-record-method="duid"><label>DUID<input name="recordGetValue" placeholder="000300019009d009781d"></label></div><label>筛选规则<input name="recordRule" placeholder="空值表示选择第一个公网 IP"><span class="field-help"><span class="hint-icon">?</span>规则说明：空值选择第一个公网 IP；index@n 选择第 n 个；splice@n@后缀 使用第 n 个 IPv6 前缀拼接后缀；contain@substr 选择包含指定文本的第一个 IP。</span></label></div></template>
      <div class="form-actions"><a class="button" href="/">取消</a><button class="primary" type="submit">保存配置</button></div>
    </form>
  </main>
  <script>
    const list = document.querySelector('#records-list');
    const template = document.querySelector('#record-template');
    const helpText = {cmd: '通过执行系统命令获取IP地址。', nic: '选择系统网卡获取IP地址。', url: '访问URL获取IP地址，多个URL使用英文逗号（,）分隔。', duid: '读取 DHCPv6 唯一标识获取IP地址，只支持OpenWrt系统。'};
    function syncRecord(entry) {
      const ipVersion = entry.querySelector('select[name="recordIPVersion"]');
      const duid = entry.querySelector('input[type="radio"][value="duid"]');
      if (duid) {
        duid.disabled = ipVersion?.value === '4';
        if (duid.disabled && duid.checked) entry.querySelector('input[type="radio"][value="url"]').checked = true;
      }
      const radios = Array.from(entry.querySelectorAll('[data-record-methods] input[type="radio"]'));
      const selectedRadio = radios.find(radio => radio.checked);
      const selected = selectedRadio?.value || 'url';
      const help = entry.querySelector('[data-record-help]');
      if (help) help.textContent = helpText[selected] || '';
      const panel = entry.querySelector('.method-help-panel');
      const selectedLabel = selectedRadio?.closest('.method-option');
      if (panel && selectedLabel) {
        const panelRect = panel.getBoundingClientRect();
        const labelRect = selectedLabel.getBoundingClientRect();
        const arrowPosition = ((labelRect.left + labelRect.width / 2 - panelRect.left) / panelRect.width) * 100;
        panel.style.setProperty('--help-arrow', `${arrowPosition}%`);
      }
      entry.querySelectorAll('[data-record-method]').forEach(box => {
        const show = box.dataset.recordMethod === selected;
        box.hidden = !show;
        box.querySelectorAll('input, textarea, select').forEach(input => input.disabled = !show);
      });
    }
    function syncRecords() { list.querySelectorAll('.provider-record').forEach(syncRecord); }
    document.querySelector('#add-record').addEventListener('click', () => {
      const index = list.children.length;
      list.insertAdjacentHTML('beforeend', template.innerHTML.replaceAll('__INDEX__', index).replaceAll('__NUMBER__', index + 1));
      syncRecord(list.lastElementChild);
    });
    list.addEventListener('change', event => {
      if (event.target.matches('input[type="radio"], select[name="recordIPVersion"]')) syncRecord(event.target.closest('.provider-record'));
    });
    list.addEventListener('click', event => {
      if (!event.target.closest('.remove-record')) return;
      if (list.children.length > 1) event.target.closest('.provider-record').remove();
    });
    document.querySelector('form').addEventListener('submit', () => {
      Array.from(list.children).forEach((entry, index) => {
        entry.querySelectorAll('input[type="radio"]').forEach(radio => radio.name = 'recordGetType' + index);
      });
    });
    syncRecords();
  </script>
</body>
</html>
{{end}}
